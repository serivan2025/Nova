
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- REDIRECIONAMENTO AUTOMÁTICO -->


<!-- REDIRECIONAMENTO AUTOMÁTICO APÓS 10 SEGUNDOS -->
<meta http-equiv="refresh" content="15;url=https://go.aff.nicebetpartners.com/4t0rseo7">



<title>A Nova Casa Chegou</title>

<style>
/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

html,body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

/* PÁGINA */
.page{
  width:100%;
  height:100vh;
  height:100svh;
  overflow:hidden;
  background:#000;
  color:#fff;
  display:flex;
  flex-direction:column;
}

/* GRÁFICO */
.graph{
  width:100%;
  height:45vh;
  height:45svh;
  flex-shrink:0;
  overflow:hidden;
  position:relative;
  z-index:2;
}

.graph img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center -85px;
  filter:brightness(.95) contrast(1.05);
}

/* TÍTULO NO TOPO */
.hero-title{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  width:calc(100% - 28px);
  max-width:430px;
  padding:13px 12px;
  border-radius:16px;
  text-align:center;
  background:linear-gradient(
    135deg,
    rgba(0,0,0,.88),
    rgba(45,15,0,.78)
  );
  border:1px solid rgba(255,145,0,.45);
  box-shadow:0 0 22px rgba(255,90,0,.25);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

/* TÍTULO PRINCIPAL */
.hero-title h1{
  font-size:clamp(18px,5vw,27px);
  font-weight:900;
  line-height:1.1;
  letter-spacing:.3px;
  color:#fff;
  text-shadow:0 0 12px rgba(255,90,0,.8);
}

.hero-title h1 span{
  color:#ff9b20;
}

/* SUBTÍTULO */
.hero-title p{
  margin-top:6px;
  font-size:clamp(12px,3.5vw,16px);
  font-weight:800;
  color:#ffd45b;
  letter-spacing:.4px;
}

/* FADE DO GRÁFICO */
.graph::after{
  content:"";
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:90px;
  background:linear-gradient(
    to bottom,
    transparent,
    #000
  );
  z-index:3;
  pointer-events:none;
}

/* ÁREA DE AÇÃO */
.action{
  width:100%;
  flex:1;
  min-height:0;
  padding:8px 14px 14px;
  display:flex;
  flex-direction:column;
  justify-content:space-evenly;
  align-items:center;
  text-align:center;
  background:
    radial-gradient(
      circle at top,
      rgba(255,115,0,.20),
      transparent 55%
    ),
    linear-gradient(180deg,#050505,#000);
  position:relative;
  z-index:4;
}

/* BÓNUS */
.bonus{
  width:100%;
  max-width:370px;
  padding:11px 12px;
  border-radius:14px;
  background:linear-gradient(
    90deg,
    #ff7a00,
    #ffc400
  );
  color:#111;
  font-size:14px;
  font-weight:900;
  box-shadow:
    0 0 20px rgba(255,132,0,.65);
  animation:bonusPulse 1.2s infinite;
}

@keyframes bonusPulse{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.025);
  }
}

/* TEXTO */
.copy{
  font-size:13px;
  font-weight:800;
  color:#eee;
  line-height:1.3;
  max-width:360px;
}

/* CONTAINER DOS BOTÕES */
.buttons{
  width:100%;
  max-width:370px;
  display:grid;
  grid-template-columns:1.35fr 1fr;
  gap:10px;
  align-items:center;
}

/* ESTILO BASE DOS BOTÕES */
.btn{
  border-radius:14px;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:900;
  text-transform:uppercase;
  white-space:nowrap;
  transition:
    transform .2s,
    box-shadow .2s;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

/* BOTÃO REGISTAR AGORA */
.btn-main{
  height:56px;
  font-size:12.5px;
  color:#fff;
  background:linear-gradient(
    135deg,
    #ff2020,
    #ff8500
  );
  border:1px solid #ff9b30;
  box-shadow:
    0 0 18px rgba(255,60,0,.75),
    0 0 32px rgba(255,100,0,.35);
  animation:mainPulse 1.5s infinite;
}

/* BOTÃO BÓNUS */
.btn-alt{
  height:46px;
  font-size:12px;
  color:#fff;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.30);
  box-shadow:
    0 3px 12px rgba(0,0,0,.3);
}

/* ANIMAÇÃO DO BOTÃO PRINCIPAL */
@keyframes mainPulse{
  0%,100%{
    transform:scale(1);
    box-shadow:
      0 0 18px rgba(255,60,0,.65);
  }

  50%{
    transform:scale(1.035);
    box-shadow:
      0 0 30px rgba(255,100,0,.9);
  }
}

/* EFEITO AO CLICAR */
.btn:active{
  transform:scale(.96);
}

/* ACESSIBILIDADE */
.btn:focus-visible{
  outline:2px solid #fff;
  outline-offset:4px;
}

@media(prefers-reduced-motion:reduce){
  .bonus,
  .btn-main{
    animation:none;
  }
}

/* TELEMÓVEIS COM ECRÃ PEQUENO */
@media(max-height:700px){
  .graph{
    height:42vh;
    height:42svh;
  }

  .hero-title{
    top:7px;
    padding:9px 10px;
  }

  .hero-title h1{
    font-size:18px;
  }

  .hero-title p{
    font-size:12px;
    margin-top:4px;
  }

  .bonus{
    font-size:12px;
    padding:8px;
  }

  .copy{
    font-size:11.5px;
  }

  .btn-main{
    height:50px;
    font-size:11.5px;
  }

  .btn-alt{
    height:42px;
    font-size:11px;
  }
}

/* ECRÃS MUITO ESTREITOS */
@media(max-width:340px){
  .buttons{
    gap:7px;
  }

  .btn-main{
    font-size:10.5px;
  }

  .btn-alt{
    font-size:10.5px;
  }

  .hero-title h1{
    font-size:17px;
  }

  .hero-title p{
    font-size:11px;
  }
}

</style>
</head>

<body>

<div class="page">

      <p>

    <!-- BOTÕES -->
    <div class="buttons">

      >
        🚀 Registar Agora
      </a>

      <a
        href="https://serivan2025.github.io/Golden_Time/"

    </div>

  </div>

</div>

</html>
